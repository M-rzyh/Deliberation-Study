defaults:
    - agent: sac
    
# this needs to be specified manually
experiment: PEBBLE

# reward learning
segment: 50
activation: tanh
num_seed_steps: 1000
num_unsup_steps: 5000
num_interact: 5000
reward_lr: 0.0003
reward_batch: 128
reward_update: 200
feed_type: 0
reset_update: 100
topK: 5
ensemble_size: 3
max_feedback: 1400
large_batch: 10
label_margin: 0.0
teacher_beta: -1
teacher_gamma: 1
teacher_eps_mistake: 0
teacher_eps_skip: 0
teacher_eps_equal: 0

# offline human-feedback query logging
collect_human_queries: true
human_query_dir: human_queries
human_query_separate_by_job_id: true
human_query_job_id_env: SLURM_JOB_ID
human_query_job_id: ''
human_query_save_videos: true
human_query_video_dir: ${human_query_dir}/videos
human_query_video_env: walker_walk
human_query_video_fps: 30
human_query_video_width: 1280
human_query_video_height: 720

# use pre-collected human labels instead of synthetic/oracle labels
use_offline_human_labels: false
offline_human_query_dir: human_queries
offline_human_labels_csv: ${offline_human_query_dir}/human_labels.csv
offline_human_job_id: ''
offline_human_max_labels: 0
offline_human_continue_with_synthetic: false

# time-based sample weighting: none, linear, sqrt, log
time_weight_strategy: none

# ask for human labels during training (poll labels CSV while training runs)
use_online_human_labels: false
online_human_labels_csv: human_labels.csv
online_human_poll_interval_sec: 5.0
online_human_timeout_sec: 0.0

# scheduling
reward_schedule: 0

num_train_steps: 1e6
replay_buffer_capacity: ${num_train_steps}

# evaluation config
eval_frequency: 10000
num_eval_episodes: 10
device: cpu

# logger
log_frequency: 10000
log_save_tb: true

# video recorder
save_video: false
save_last_train_episode_videos: true
last_train_video_count: 5
last_train_video_fps: 30
last_train_video_dir: train_episode_videos

# setups
seed: 1

# Environment
env: dog_stand
gradient_update: 1

# hydra configuration

hydra:
  run:
    dir: ./logs

    
